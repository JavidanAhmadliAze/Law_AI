# APPLICATION stack — serves queries against an index the ingestion stack built.
#
#   docker compose -f docker/docker-compose.yml up
#
# Ingestion (Airflow) is a separate stack: docker/docker-compose.ingest.yml.
# Both include docker-compose.infra.yml under the same project name, so they
# share one Postgres, one OpenSearch and one TEI rather than duplicating them.
#
# NOTE: while the ingestion stack is running, Compose reports law-ai-airflow-1
# as an orphan of this file. That warning is expected and harmless — do NOT
# pass --remove-orphans here, it would delete the running Airflow container.
name: law-ai

include:
  - docker-compose.infra.yml

services:
  redis:
    restart: unless-stopped
    # exact-match RAG answer cache (services/cache); ephemeral by design.
    # App-only: the ingestion pipeline has no answers to cache.
    image: redis:7-alpine
    ports:
      - "6381:6379"   # 6379/6380 reserved for the user's other local projects
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      # override the .env localhost/host-port values with compose network names +
      # internal ports — inside the container "localhost" is the app itself
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      OPENSEARCH__HOST: opensearch
      OPENSEARCH__PORT: "9200"
      EMBEDDING__API_URL: http://tei:80
      REDIS__HOST: redis
      REDIS__PORT: "6379"
    volumes:
      # The reranker is a local fine-tune, not a Hub id, and the image copies
      # only src/ — without this the container resolves RERANKER__MODEL to a
      # path that does not exist and sentence-transformers falls through to the
      # Hub, where the name is not a repo either. Read-only: nothing writes it.
      - ../fine_tuning:/app/fine_tuning:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      tei:
        condition: service_healthy
